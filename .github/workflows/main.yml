name: RDP Desktop

on:
  workflow_dispatch:

jobs:
  desktop:

    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y xfce4 xfce4-goodies xrdp xorgxrdp dbus-x11


    - name: Create user
      run: |
        sudo adduser --disabled-password --gecos "" rdpuser
        echo "rdpuser:123456" | sudo chpasswd

        sudo usermod -aG ssl-cert rdpuser

        echo "startxfce4" | sudo tee /home/rdpuser/.xsession

        sudo chown rdpuser:rdpuser /home/rdpuser/.xsession


    - name: Configure xrdp
      run: |
        sudo systemctl enable xrdp
        sudo systemctl restart xrdp


    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh


    - name: Connect VPN
      env:
        TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

      run: |
        sudo tailscale up --authkey=$TS_AUTHKEY

        echo "===================="
        echo "SERVER IP:"
        tailscale ip -4
        echo "===================="


    - name: Check
      run: |
        echo "USERNAME: rdpuser"
        echo "PASSWORD: 123456"

        echo "PORT:"
        ss -tlnp | grep 3389 || true


    - name: Keep alive
      run: |
        while true
        do
          echo "SERVER RUNNING"
          sleep 300
        done
