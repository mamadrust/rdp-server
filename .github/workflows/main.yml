name: RDP Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies xrdp xorgxrdp dbus-x11 dbus

      - name: User
        run: |
          sudo useradd -m -s /bin/bash rdpuser || true
          echo "rdpuser:123456" | sudo chpasswd
          sudo usermod -aG ssl-cert rdpuser

          sudo -u rdpuser bash -c 'echo "dbus-run-session -- startxfce4" > /home/rdpuser/.xsession'

          sudo chmod +x /home/rdpuser/.xsession
          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession

      - name: XRDP
        run: |
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sudo systemctl restart xrdp-sesman

      - name: Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          sudo tailscale up --authkey=$TS_AUTHKEY
          tailscale ip -4

      - name: Status
        run: |
          echo rdpuser
          echo 123456
          ss -tlnp | grep 3389 || true
          tailscale ip -4

      - name: Alive
        run: |
          while true
          do
            sleep 300
          done
