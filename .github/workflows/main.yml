name: RDP Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

    - uses: actions/checkout@v4


    - name: Install Desktop XRDP
      run: |
        sudo apt update
        sudo DEBIAN_FRONTEND=noninteractive apt install -y \
          xfce4 \
          xfce4-goodies \
          xfce4-session \
          xfconf \
          dbus-x11 \
          xrdp \
          xorgxrdp


    - name: Create RDP User
      run: |
        sudo useradd -m -s /bin/bash rdpuser || true
        echo "rdpuser:123456" | sudo chpasswd

        sudo usermod -aG ssl-cert rdpuser

        sudo mkdir -p /home/rdpuser/.config/xfce4

        echo "dbus-launch --exit-with-session startxfce4" | sudo tee /home/rdpuser/.xsession

        sudo chown -R rdpuser:rdpuser /home/rdpuser


    - name: Fix XRDP
      run: |

        sudo sed -i '/test -x \/etc\/X11\/Xsession/c\# disabled' /etc/xrdp/startwm.sh

        echo "dbus-launch --exit-with-session startxfce4" | sudo tee -a /etc/xrdp/startwm.sh

        sudo systemctl enable xrdp
        sudo systemctl restart xrdp


    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh


    - name: Connect Tailscale
      env:
        TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      run: |

        sudo tailscale up --authkey=$TS_AUTHKEY

        echo "================="
        echo "RDP IP:"
        tailscale ip -4
        echo "================="


    - name: Test
      run: |

        echo USER:
        echo rdpuser

        echo PASSWORD:
        echo 123456

        echo PORT:
        ss -tlnp | grep 3389 || true


    - name: Keep Alive
      run: |

        while true
        do
          echo "RDP ACTIVE"
          sleep 300
        done
