name: RDP Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

    - name: Update system
      run: |
        sudo apt update

    - name: Install XFCE Desktop
      run: |
        sudo apt install -y xfce4 xfce4-goodies dbus-x11 xorgxrdp xrdp

    - name: Configure XRDP
      run: |
        sudo adduser xrdp ssl-cert

        sudo systemctl enable xrdp
        sudo systemctl restart xrdp

        echo "startxfce4" > ~/.xsession

        sudo sed -i '/test -x \/etc\/X11\/Xsession && exec \/etc\/X11\/Xsession/i dbus-launch --exit-with-session' /etc/xrdp/startwm.sh


    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh


    - name: Connect Tailscale
      env:
        TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      run: |
        sudo tailscale up --authkey=$TS_AUTHKEY

        echo "================="
        echo "TAILSCALE IP"
        echo "================="

        tailscale ip -4


    - name: Create RDP User
      run: |
        sudo useradd -m -s /bin/bash rdpuser
        echo "rdpuser:123456" | sudo chpasswd
        sudo usermod -aG ssl-cert rdpuser

        echo "startxfce4" | sudo tee /home/rdpuser/.xsession

        sudo chown rdpuser:rdpuser /home/rdpuser/.xsession


    - name: Restart XRDP
      run: |
        sudo systemctl restart xrdp
        sudo systemctl restart xrdp-sesman


    - name: Show Info
      run: |
        echo USER:
        echo rdpuser

        echo PASSWORD:
        echo 123456

        echo IP:
        tailscale ip -4

        echo PORT:
        ss -tlnp | grep 3389


    - name: Keep Server Alive
      run: |
        while true
        do
          echo "RDP SERVER RUNNING"
          sleep 300
        done
