name: RDP Desktop (XFCE)

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install XFCE, XRDP and dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xfce4-terminal \
            xfconf \
            dbus-x11 \
            xrdp \
            xorgxrdp \
            curl \
            ca-certificates

      - name: Create RDP user
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -eux

          if [ -z "${RDP_PASSWORD:-}" ]; then
            echo "ERROR: Secret RDP_PASSWORD is not set."
            exit 1
          fi

          if ! id rdpuser >/dev/null 2>&1; then
            sudo useradd --create-home --shell /bin/bash rdpuser
          fi

          echo "rdpuser:${RDP_PASSWORD}" | sudo chpasswd

          # XRDP برای خواندن گواهی TLS نیاز به این گروه دارد.
          sudo usermod -aG ssl-cert rdpuser

          # حذف فایل‌های session قبلی تا با startwm.sh تداخل نکنند.
          sudo rm -f /home/rdpuser/.xsession
          sudo rm -f /home/rdpuser/.Xclients
          sudo rm -f /home/rdpuser/.xsession-errors

          sudo install -d \
            -o rdpuser \
            -g rdpuser \
            -m 700 \
            /home/rdpuser/.config \
            /home/rdpuser/.cache

      - name: Configure XRDP to start XFCE
        run: |
          set -eux

          # از فایل اصلی بکاپ می‌گیریم.
          sudo cp /etc/xrdp/startwm.sh /etc/xrdp/startwm.sh.original

          # نکته:
          # startwm.sh توسط همان کاربری اجرا می‌شود که با RDP لاگین کرده است.
          # بنابراین نباید داخل آن نام کاربر را hard-code یا sudo استفاده کنیم.
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh
          #
          # Minimal XRDP + XFCE session launcher for Ubuntu.
          #

          # آدرس‌های D-Bus مربوط به sessionهای قبلی باعث خطای XFCE می‌شوند.
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          # مقدار استاندارد Ubuntu برای تنظیمات دسکتاپ.
          # مسیرهای اضافی و غیر استاندارد عمداً اضافه نشده‌اند.
          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_SESSION_TYPE=x11

          # یک D-Bus تمیز برای session جدید ساخته و XFCE را اجرا می‌کند.
          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod 755 /etc/xrdp/startwm.sh

          # XRDP/Xorg برای محیط CI به این دسترسی نیاز دارد.
          if [ -f /etc/X11/Xwrapper.config ]; then
            sudo sed -i \
              's/^allowed_users=.*/allowed_users=anybody/' \
              /etc/X11/Xwrapper.config
          fi

          sudo chmod 1777 /tmp

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 3

          echo "=== XRDP service ==="
          sudo systemctl --no-pager --full status xrdp || true

          echo "=== Listening port ==="
          sudo ss -ltnp | grep ':3389' || true

      - name: Install Tailscale
        run: |
          set -eux
          curl -fsSL https://tailscale.com/install.sh | sudo sh

      - name: Connect to Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -eux

          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "ERROR: Secret TS_AUTHKEY is not set."
            exit 1
          fi

          sudo tailscale up \
            --authkey="${TS_AUTHKEY}" \
            --hostname="github-rdp-${{ github.run_id }}"

          echo ""
          echo "=========================================="
          echo " RDP ADDRESS:"
          tailscale ip -4
          echo " PORT: 3389"
          echo " USERNAME: rdpuser"
          echo " PASSWORD: value of RDP_PASSWORD secret"
          echo "=========================================="

      - name: Diagnostics
        run: |
          echo "=== Installed XFCE session binary ==="
          command -v startxfce4
          command -v xfce4-session
          command -v dbus-run-session

          echo "=== XRDP start script ==="
          sudo cat /etc/xrdp/startwm.sh

          echo "=== XRDP port ==="
          sudo ss -ltnp | grep ':3389' || true

          echo "=== XRDP logs ==="
          sudo tail -n 100 /var/log/xrdp.log || true
          sudo tail -n 100 /var/log/xrdp-sesman.log || true

      - name: Keep session alive
        run: |
          while true; do
            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - RDP is active"
            sleep 300
          done
