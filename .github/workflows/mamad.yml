name: Windows RDP

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService

      - name: Create RDP User
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "Rdp@2026Test!" -AsPlainText -Force
          New-LocalUser -Name "rdpuser" -Password $Password -PasswordNeverExpires
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser"

      - name: Install Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Show Server Information
        shell: powershell
        run: |
          Write-Host "=============================="
          Write-Host "WINDOWS RDP SERVER"
          Write-Host "=============================="
          Write-Host "USER: rdpuser"
          Write-Host "PASSWORD: m2021188"
          Write-Host "TAILSCALE IP:"
          tailscale ip -4
          Write-Host "=============================="
          Get-Service TermService
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" | Select-Object DisplayName, Enabled

      - name: Keep Server Alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "$(Get-Date) - WINDOWS RDP SERVER RUNNING"
            Start-Sleep -Seconds 300
          }
