name: RDP Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Install Desktop
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies dbus-x11

      - name: Install XRDP
        run: |
          sudo apt install -y xrdp
          sudo adduser xrdp ssl-cert
          sudo systemctl enable xrdp || true
          
          sudo sed -i 's/console/console/' /etc/xrdp/startwm.sh

          echo "startxfce4" > ~/.xsession

          sudo systemctl restart xrdp || true

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          sudo tailscale up --authkey=$TS_AUTHKEY
          echo "Tailscale IP:"
          tailscale ip -4

      - name: Create RDP User
        run: |
          sudo useradd -m -s /bin/bash rdpuser
          echo "rdpuser:123456" | sudo chpasswd
          sudo usermod -aG ssl-cert rdpuser

      - name: Start XRDP
        run: |
          sudo service xrdp restart || true
          sudo service xrdp-sesman restart || true

      - name: Debug RDP
        run: |
          echo "===== USER ====="
          whoami
          echo "===== XRDP PROCESS ====="
          ps aux | grep xrdp
          echo "===== PORT 3389 ====="
          ss -tlnp | grep 3389 || true
          echo "===== TAILSCALE IP ====="
          tailscale ip -4

      - name: Keep Alive
        run: |
          while true; do
            echo "RDP server running..."
            sleep 300
          done
