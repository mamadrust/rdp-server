name: RDP Desktop

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install packages
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y \
            xfce4 xfce4-goodies xfce4-session xfconf \
            dbus dbus-x11 dbus-user-session \
            xrdp xorgxrdp

      - name: Create user
        env:
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          sudo useradd -m -s /bin/bash rdpuser || true
          echo "rdpuser:${RDP_PASS}" | sudo chpasswd
          sudo usermod -aG ssl-cert rdpuser

      - name: Configure session
        run: |
          # پاک کردن تنظیمات قبلی
          sudo rm -rf /home/rdpuser/.config/xfce4
          sudo rm -rf /home/rdpuser/.cache/sessions

          # فایل جلسه ساده و تمیز
          echo '#!/bin/sh' | sudo tee /home/rdpuser/.xsession
          echo 'exec dbus-run-session startxfce4' | sudo tee -a /home/rdpuser/.xsession

          sudo chmod +x /home/rdpuser/.xsession
          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession

      - name: Configure XRDP
        run: |
          # بازنویسی کامل startwm.sh
          sudo tee /etc/xrdp/startwm.sh > /dev/null << 'EOF'
#!/bin/sh
unset DBUS_SESSION_BUS_ADDRESS
unset XDG_RUNTIME_DIR
exec /home/rdpuser/.xsession
EOF

          sudo chmod +x /etc/xrdp/startwm.sh
          sudo systemctl restart xrdp

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          sudo tailscale up --authkey=$TS_AUTHKEY --hostname=rdp-github
          echo "===================="
          echo "RDP IP:"
          tailscale ip -4
          echo "===================="

      - name: Keep session alive
        run: |
          while true; do
            echo "RDP is running - $(date)"
            sleep 300
          done
